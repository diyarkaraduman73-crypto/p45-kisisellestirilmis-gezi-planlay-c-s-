# Render Blueprint: backend (API) + frontend (statik site) tek seferde kurulur.
# Render > New > Blueprint > bu depoyu seç. "sync: false" olan değerleri Render senden ister.
services:
  # ---------- Backend: Node.js + Express REST API ----------
  - type: web
    name: gezi-planlayici-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm install
    # Her açılışta: eksik migration'lar uygulanır, veritabanı boşsa örnek veri yüklenir
    # (ikisi de zaten yapılmışsa hiçbir şey değiştirmez), sonra API başlar.
    startCommand: npm run db:setup; npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TURSO_DATABASE_URL      # libsql://<veritabani>-<kullanici>.turso.io
        sync: false
      - key: TURSO_AUTH_TOKEN        # turso db tokens create <veritabani>
        sync: false
      - key: JWT_SECRET              # Render rastgele ve gizli bir değer üretir
        generateValue: true
      - key: SESSION_TTL_MINUTES
        value: "120"
      - key: CORS_ORIGIN             # frontend adresi: https://gezi-planlayici.onrender.com
        sync: false

  # ---------- Frontend: React + Vite statik site ----------
  - type: web
    name: gezi-planlayici
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL            # backend adresi: https://gezi-planlayici-api.onrender.com
        sync: false
